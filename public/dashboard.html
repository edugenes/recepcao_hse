<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema de Recepção HSE</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0D47A1 0%, #083B8A 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0F52BA 0%, #0B3E91 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .back-btn {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .dashboard-content {
            padding: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .stat-card.active {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .stat-card.warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }

        .stat-card.danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .stat-card.info {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1rem;
            opacity: 0.9;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .chart-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #1f2937;
        }

        .recent-activity {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .activity-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 1.2rem;
        }

        .activity-icon.visitor {
            background: #dbeafe;
            color: #3b82f6;
        }

        .activity-icon.key {
            background: #fef3c7;
            color: #f59e0b;
        }

        .activity-icon.user {
            background: #d1fae5;
            color: #10b981;
        }

        .activity-content {
            flex: 1;
        }

        .activity-text {
            font-weight: 500;
            margin-bottom: 5px;
        }

        .activity-time {
            font-size: 0.9rem;
            color: #6b7280;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #6b7280;
        }

        .error {
            background: #fef2f2;
            color: #dc2626;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .back-btn {
                position: static;
                transform: none;
                margin-bottom: 20px;
                display: inline-block;
            }
            
            .dashboard-content {
                padding: 20px;
            }
            
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="back-btn">← Voltar</a>
            <h1>📊 Dashboard</h1>
            <p>Visão geral do sistema de recepção</p>
        </div>

        <div class="dashboard-content">
            <!-- Estatísticas -->
            <div class="stats-grid" id="statsGrid">
                <div class="loading">Carregando estatísticas...</div>
            </div>

            <!-- Gráficos -->
            <div class="charts-grid">
                <div class="chart-container">
                    <div class="chart-title">Visitantes por Setor</div>
                    <canvas id="sectorChart" width="400" height="200"></canvas>
                </div>
                
                <div class="chart-container">
                    <div class="chart-title">Visitantes por Tipo</div>
                    <canvas id="typeChart" width="400" height="200"></canvas>
                </div>
                
                <div class="chart-container">
                    <div class="chart-title">Movimentação Diária</div>
                    <canvas id="dailyChart" width="400" height="200"></canvas>
                </div>
                
                <div class="chart-container">
                    <div class="chart-title">Status das Chaves</div>
                    <canvas id="keysChart" width="400" height="200"></canvas>
                </div>
            </div>

            <!-- Atividade Recente -->
            <div class="recent-activity">
                <div class="chart-title">Atividade Recente</div>
                <div id="recentActivity">
                    <div class="loading">Carregando atividade recente...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('token');
        let user = JSON.parse(localStorage.getItem('user') || '{}');

        // Verificar autenticação
        if (!token) {
            window.location.href = '/';
            return;
        }

        // Configurar headers para requisições
        const headers = {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
        };

        // Carregar estatísticas
        async function loadStats() {
            try {
                const response = await fetch('/api/dashboard/stats', { headers });
                if (!response.ok) throw new Error('Erro ao carregar estatísticas');
                
                const stats = await response.json();
                renderStats(stats);
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('statsGrid').innerHTML = 
                    '<div class="error">Erro ao carregar estatísticas</div>';
            }
        }

        function renderStats(stats) {
            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="stat-card active">
                    <div class="stat-number">${stats.visitantesAtivos}</div>
                    <div class="stat-label">Visitantes Ativos</div>
                </div>
                <div class="stat-card info">
                    <div class="stat-number">${stats.totalVisitantes}</div>
                    <div class="stat-label">Total de Visitantes</div>
                </div>
                <div class="stat-card warning">
                    <div class="stat-number">${stats.chavesEmprestadas}</div>
                    <div class="stat-label">Chaves Emprestadas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${stats.totalChaves}</div>
                    <div class="stat-label">Total de Chaves</div>
                </div>
            `;
        }

        // Carregar dados para gráficos
        async function loadChartData() {
            try {
                const response = await fetch('/api/dashboard/charts', { headers });
                if (!response.ok) throw new Error('Erro ao carregar dados dos gráficos');
                
                const data = await response.json();
                renderCharts(data);
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        function renderCharts(data) {
            // Gráfico de visitantes por setor
            const sectorCtx = document.getElementById('sectorChart').getContext('2d');
            new Chart(sectorCtx, {
                type: 'doughnut',
                data: {
                    labels: data.sectors.map(s => s.nome),
                    datasets: [{
                        data: data.sectors.map(s => s.count),
                        backgroundColor: [
                            '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });

            // Gráfico de visitantes por tipo
            const typeCtx = document.getElementById('typeChart').getContext('2d');
            new Chart(typeCtx, {
                type: 'bar',
                data: {
                    labels: data.types.map(t => t.tipo),
                    datasets: [{
                        label: 'Visitantes',
                        data: data.types.map(t => t.count),
                        backgroundColor: '#3b82f6'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

            // Gráfico de movimentação diária
            const dailyCtx = document.getElementById('dailyChart').getContext('2d');
            new Chart(dailyCtx, {
                type: 'line',
                data: {
                    labels: data.daily.map(d => d.data),
                    datasets: [{
                        label: 'Entradas',
                        data: data.daily.map(d => d.entradas),
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        tension: 0.4
                    }, {
                        label: 'Saídas',
                        data: data.daily.map(d => d.saidas),
                        borderColor: '#ef4444',
                        backgroundColor: 'rgba(239, 68, 68, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

            // Gráfico de status das chaves
            const keysCtx = document.getElementById('keysChart').getContext('2d');
            new Chart(keysCtx, {
                type: 'pie',
                data: {
                    labels: ['Disponíveis', 'Emprestadas'],
                    datasets: [{
                        data: [data.keysDisponiveis, data.keysEmprestadas],
                        backgroundColor: ['#10b981', '#f59e0b']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        // Carregar atividade recente
        async function loadRecentActivity() {
            try {
                const response = await fetch('/api/dashboard/activity', { headers });
                if (!response.ok) throw new Error('Erro ao carregar atividade recente');
                
                const activities = await response.json();
                renderRecentActivity(activities);
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('recentActivity').innerHTML = 
                    '<div class="error">Erro ao carregar atividade recente</div>';
            }
        }

        function renderRecentActivity(activities) {
            const container = document.getElementById('recentActivity');
            
            if (activities.length === 0) {
                container.innerHTML = '<div class="loading">Nenhuma atividade recente</div>';
                return;
            }

            container.innerHTML = activities.map(activity => `
                <div class="activity-item">
                    <div class="activity-icon ${activity.type}">
                        ${activity.icon}
                    </div>
                    <div class="activity-content">
                        <div class="activity-text">${activity.text}</div>
                        <div class="activity-time">${activity.time}</div>
                    </div>
                </div>
            `).join('');
        }

        // Atualizar dados a cada 30 segundos
        function startAutoRefresh() {
            setInterval(() => {
                loadStats();
                loadChartData();
                loadRecentActivity();
            }, 30000);
        }

        // Inicializar dashboard
        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadChartData();
            loadRecentActivity();
            startAutoRefresh();
        });
    </script>
</body>
</html>
