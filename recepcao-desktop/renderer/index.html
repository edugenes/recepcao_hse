<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Recepção HSE v3.0 - Desktop App</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .biometric-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            color: white;
        }
        .biometric-preview {
            width: 200px;
            height: 200px;
            border: 3px solid #fff;
            border-radius: 50%;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        .biometric-button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }
        .biometric-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .biometric-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-success { background-color: #10b981; }
        .status-error { background-color: #ef4444; }
        .status-warning { background-color: #f59e0b; }
        .status-info { background-color: #3b82f6; }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Header -->
    <header class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center">
                    <i class="fas fa-hospital text-blue-600 text-2xl mr-3"></i>
                    <h1 class="text-2xl font-bold text-gray-900">Sistema de Recepção HSE</h1>
                    <span class="ml-3 px-3 py-1 bg-blue-100 text-blue-800 text-sm rounded-full">v3.0 Desktop</span>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="flex items-center">
                        <span class="status-indicator status-success"></span>
                        <span class="text-sm text-gray-600">Leitor Conectado</span>
                    </div>
                    <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition">
                        <i class="fas fa-sign-out-alt mr-2"></i>Sair
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Dashboard Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-blue-100 text-blue-600">
                        <i class="fas fa-users text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">Visitantes Hoje</p>
                        <p class="text-2xl font-semibold text-gray-900" id="visitorsToday">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-green-100 text-green-600">
                        <i class="fas fa-key text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">Chaves Emprestadas</p>
                        <p class="text-2xl font-semibold text-gray-900" id="keysBorrowed">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-yellow-100 text-yellow-600">
                        <i class="fas fa-fingerprint text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">Digitais Capturadas</p>
                        <p class="text-2xl font-semibold text-gray-900" id="biometricsCaptured">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-purple-100 text-purple-600">
                        <i class="fas fa-chart-line text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">Taxa de Sucesso</p>
                        <p class="text-2xl font-semibold text-gray-900" id="successRate">100%</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cadastro de Visitante -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-xl font-bold text-gray-900 mb-6">
                <i class="fas fa-user-plus mr-2 text-blue-600"></i>Cadastrar Visitante
            </h2>
            
            <form id="visitorForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Nome Completo</label>
                        <input type="text" id="nome" name="nome" required 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">CPF</label>
                        <input type="text" id="cpf" name="cpf" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Setor</label>
                        <select id="setor" name="setor" required 
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">Selecione um setor</option>
                            <option value="UTI">UTI</option>
                            <option value="Emergência">Emergência</option>
                            <option value="Cirurgia">Cirurgia</option>
                            <option value="Cardiologia">Cardiologia</option>
                            <option value="Neurologia">Neurologia</option>
                            <option value="Pediatria">Pediatria</option>
                            <option value="Oncologia">Oncologia</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Paciente</label>
                        <input type="text" id="paciente" name="paciente" required 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>

                <!-- Seção Biométrica -->
                <div class="biometric-section">
                    <h3 class="text-lg font-bold mb-4">
                        <i class="fas fa-fingerprint mr-2"></i>Captura de Impressão Digital
                    </h3>
                    
                    <div class="text-center">
                        <div class="biometric-preview" id="biometricPreview">
                            <i class="fas fa-hand-paper text-4xl opacity-50"></i>
                        </div>
                        
                        <div class="mb-4">
                            <span class="status-indicator status-info"></span>
                            <span id="biometricStatus">Pronto para captura</span>
                        </div>
                        
                        <div class="space-x-4">
                            <button type="button" id="captureBtn" class="biometric-button">
                                <i class="fas fa-camera mr-2"></i>Capturar Digital
                            </button>
                            <button type="button" id="skipBtn" class="biometric-button bg-gray-500 hover:bg-gray-600">
                                <i class="fas fa-forward mr-2"></i>Pular
                            </button>
                        </div>
                        
                        <div class="mt-4 text-sm opacity-75">
                            <i class="fas fa-info-circle mr-1"></i>
                            Leitor DigitalPersona 4500 conectado
                        </div>
                    </div>
                </div>

                <div class="flex justify-end space-x-4">
                    <button type="button" id="clearBtn" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition">
                        <i class="fas fa-eraser mr-2"></i>Limpar
                    </button>
                    <button type="submit" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition">
                        <i class="fas fa-save mr-2"></i>Cadastrar Visitante
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
